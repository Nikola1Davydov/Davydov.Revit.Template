# This repository only (the template leaves it out): checks that a project made from the template builds
name: Check template

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-template-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Pack and install the template
        shell: pwsh
        run: |
          dotnet pack template/Davydov.Revit.Templates.csproj -o "$env:RUNNER_TEMP/template"
          dotnet new install (Get-ChildItem "$env:RUNNER_TEMP/template/*.nupkg").FullName

      - name: Create a project from the template
        shell: pwsh
        run: dotnet new davydov-revit -n Acme.Revit.Tools --vendor Acme -o "$env:RUNNER_TEMP/Acme.Revit.Tools"

      - name: Check the project has no placeholder names and no repository-only files
        shell: pwsh
        working-directory: ${{ runner.temp }}/Acme.Revit.Tools
        run: |
          # Placeholder names, and references to this repository's plan or to AnalyseTool that mean nothing in a new project
          $leftovers = Get-ChildItem -Recurse -File | Select-String -Pattern 'Davydov\.Revit\.Addin|Davydov_Revit_Addin|davydov-revit-addin|<VendorId>Davydov<|\(plan, |docs/PLAN|AnalyseTool'
          $extra = @('tests', 'docs', 'template', 'LICENSE', 'build/RepositoryModules.cs', '.github/workflows/Template.yml' | Where-Object { Test-Path $_ })
          # The agent files of the add-in, not the ones of this repository (those are in Russian)
          $missing = @('AGENTS.md', 'CLAUDE.md', 'ARCHITECTURE.md', '.agents/skills/add-ribbon-button/SKILL.md', '.agents/skills/add-command/SKILL.md', '.agents/skills/add-page/SKILL.md' | Where-Object { -not (Test-Path $_) })
          if ((Test-Path AGENTS.md) -and (Get-Content AGENTS.md -Raw) -match '\p{IsCyrillic}') { $extra += 'AGENTS.md of the template repository' }
          $missing | ForEach-Object { "Missing from the project: $_" }
          $leftovers | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          $extra | ForEach-Object { "Not part of the template: $_" }
          if ($leftovers -or $extra -or $missing) { exit 1 }

      # On a build server GitVersion needs exactly one remote, and the new repository has none: a fixed version skips
      # GitVersion here (the CI of this repository checks it)
      - name: Compile the project
        shell: pwsh
        working-directory: ${{ runner.temp }}/Acme.Revit.Tools
        env:
          Build__Version: 0.0.1-template.1
        run: |
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Created from the template"
          dotnet run -c Release --project build

      # The Launcher rule names the add-in, so it has to follow the rename: a type of the add-in in the Launcher must fail
      - name: Check the boundary rule of the Launcher after the rename
        shell: pwsh
        working-directory: ${{ runner.temp }}/Acme.Revit.Tools
        run: |
          Set-Content source/Acme.Revit.Tools.Launcher/BoundaryProbe.cs 'internal static class BoundaryProbe { public static System.Type Type = typeof(Acme.Revit.Tools.Application); }'
          pwsh -NoProfile -File build/Check-Boundaries.ps1
          if ($LASTEXITCODE -ne 1) { Write-Host "The Launcher rule did not catch a type of the add-in"; exit 1 }
          exit 0
